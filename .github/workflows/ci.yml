name: Build Corne VIAL firmware
on: [push, workflow_dispatch]

jobs:
  build:
    name: Build crkbd vial firmware
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure git safe directory
        run: git config --global --add safe.directory $(pwd)

      - name: Build LEFT firmware
        run: |
          qmk clean
          EXTRAFLAGS="-DINIT_EE_HANDS_LEFT" qmk compile -kb crkbd -km vial
          mv crkbd_rev1_vial.hex crkbd_vial_left.hex

      - name: Build RIGHT firmware
        run: |
          qmk clean
          EXTRAFLAGS="-DINIT_EE_HANDS_RIGHT" qmk compile -kb crkbd -km vial
          mv crkbd_rev1_vial.hex crkbd_vial_right.hex

      - name: List artifacts
        run: ls -la *.hex

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: crkbd-vial-firmware
          path: |
            crkbd_vial_left.hex
            crkbd_vial_right.hex
